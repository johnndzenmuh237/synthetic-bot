services:
  - type: web
    name: synthetic-bot
    runtime: python
    # Persistent disks require a paid plan — the Free plan cannot attach one
    # at all, and its filesystem is wiped on every deploy anyway (which is
    # also why Free can't run 24/7 unattended — see DEPLOYMENT.md).
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    disk:
      name: bot-data
      # Mounting exactly at the app's existing "data/" folder means no code
      # change is needed — database.py already writes to data/market_data.db
      # relative to the app's working directory, which resolves to this path.
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true       # Render generates a strong random secret for you
      - key: DERIV_APP_ID
        sync: false               # set manually in the Render dashboard — do not commit real values
      - key: DERIV_DEMO_TOKEN
        sync: false
      - key: DERIV_LIVE_TOKEN
        sync: false
      - key: ALLOW_REGISTRATION
        value: "true"              # flip to "false" in the Render dashboard once you've signed up

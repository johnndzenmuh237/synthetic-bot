# FREE plan blueprint — good for trying the dashboard, NOT for 24/7 trading:
#   * a free web service sleeps after ~15 min without visitors (the bot stops with it)
#   * its disk is wiped on every deploy/restart (users, settings, trade history are lost)
# For a bot that must keep running, use render.always-on.yaml instead (paid plan + disk).
services:
  - type: web
    name: synthetic-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PATH                 # secret address of the admin console, e.g. /ctl-x7k29q (letters/digits/dashes). Tell nobody.
        sync: false
      - key: ADMIN_USERNAMES            # your own username(s), comma-separated: they get the Admin page
        sync: false
      - key: TOKEN_ENCRYPTION_KEY       # any long random text; encrypts users' saved Deriv tokens. Never change it later.
        generateValue: true
      - key: FIREBASE_SERVICE_ACCOUNT   # permanent accounts + history (see FIREBASE_SETUP.md)
        sync: false
      - key: DERIV_APP_ID
        sync: false
      - key: DERIV_DEMO_TOKEN
        sync: false
      - key: DERIV_LIVE_TOKEN
        sync: false
      - key: ALLOW_REGISTRATION
        value: "true"              # set to "false" once your own login exists